
name: Cloud CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:

  # Stage 1: Gitleaks Secret Detection
  security-scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan Repository for Secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 2: Build, Test, Analyze and Push Docker Image
  build-and-push:
    name: Build, Test, Analyze and Push Docker Image
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set Up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and Run Tests
        run: mvn clean verify

      # Stage 3: SonarQube Code Analysis
      - name: SonarQube Code Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=jyoshithareddy08_cloud-cicd-pipeline
          -Dsonar.organization=jyoshithareddy08
          -Dsonar.host.url=https://sonarcloud.io

      # Stage 4: Docker Image Build and Publishing
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Build Docker Image
        if: github.event_name != 'pull_request'
        run: |
          docker build \
            -t jyoshitha8/cloud-cicd-pipeline:latest \
            -t jyoshitha8/cloud-cicd-pipeline:${{ github.sha }} \
            .

      - name: Push Docker Image
        if: github.event_name != 'pull_request'
        run: |
          docker push jyoshitha8/cloud-cicd-pipeline:latest
          docker push jyoshitha8/cloud-cicd-pipeline:${{ github.sha }}

  # Stage 5: Deploy to Google Kubernetes Engine
  deploy-to-gke:
    name: Deploy Application to GKE
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions-deployer@cloud-cicd-pipeline.iam.gserviceaccount.com

      - name: Set Up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: cloud-cicd-pipeline
          install_components: gke-gcloud-auth-plugin

      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials cloud-cicd-cluster \
            --region asia-south1 \
            --project cloud-cicd-pipeline

      - name: Update Kubernetes Deployment
        run: |
          kubectl set image deployment/cloud-cicd-app \
            cloud-cicd-pipeline=docker.io/jyoshitha8/cloud-cicd-pipeline:${{ github.sha }}

      - name: Verify Kubernetes Deployment
        run: |
          kubectl rollout status deployment/cloud-cicd-app --timeout=300s
          kubectl get deployments
          kubectl get pods
          kubectl get services
